# ============================================================================
#  Rifle: abrir archivos en la sesión actual de Emacs.
#  Este bloque lo inserta scripts/install-ranger.sh al inicio de
#  ~/.config/ranger/rifle.conf, conservando las reglas originales.
# ============================================================================
# >>> emacs-dev-env >>>
# Cualquier archivo de texto se abre con el servidor de Emacs ya en ejecución.
mime ^text = emacsclient -n -- "$1"

# Extensiones de código y documentación (aunque el MIME no sea text/*).
ext md|markdown|rst|org|txt|py|pyw|js|jsx|ts|tsx|html|htm|css|scss|sass|less|json|yaml|yml|toml|ini|cfg|conf|c|h|cpp|hpp|cc|hh|rs|go|f90|f95|f03|f08|for|sh|bash|zsh|fish|el|lisp|clj|sql|xml|tex|bib|csv|log|diff|patch = emacsclient -n -- "$1"

# Directorios: abrir Dired en la sesión actual.
mime ^inode/directory = emacsclient -n --eval "(dired \"$1\")"
# <<< emacs-dev-env <<<
